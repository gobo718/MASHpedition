<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Residence</title>
<link rel="stylesheet" href="residence.css?v=258">
<link rel="stylesheet" href="game-bar.css?v=256">
</head>
<body>
<main class="residence">

<section class="identity">

  <div class="identity-copy">
    <div class="player-name">PLAYER NAME</div>
    <div class="player-title">CURRENT TITLE</div>
    <div class="player-words">WORDS / STATUS / IDENTITY TEXT</div>
  </div>
</section>

<nav class="quick-actions" aria-label="Quick actions">
  <button aria-label="Mailbox" title="Mailbox">📬</button>
  <button aria-label="Guestbook" title="Guestbook">📖</button>
  <button aria-label="Trick-or-Treat Box" title="Trick-or-Treat Box">🎃</button>
</nav>

<section class="microflex-board">
  <div class="board-title">MICROFLEX BOARD</div>
  <div class="board-space"></div>
  <div class="event-strip"><div></div><div></div><div></div></div>
</section>

<section class="atelier" aria-label="Atelier">
  <div class="atelier-spot"><div class="atelier-label">ATELIER 1/8</div><button class="art-slot" aria-label="Artwork 1"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 2/8</div><button class="art-slot" aria-label="Artwork 2"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 3/8</div><button class="art-slot" aria-label="Artwork 3"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 4/8</div><button class="art-slot" aria-label="Artwork 4"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 5/8</div><button class="art-slot" aria-label="Artwork 5"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 6/8</div><button class="art-slot" aria-label="Artwork 6"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 7/8</div><button class="art-slot" aria-label="Artwork 7"></button></div>
  <div class="atelier-spot"><div class="atelier-label">ATELIER 8/8</div><button class="art-slot" aria-label="Artwork 8"></button></div>
</section>

<nav class="second-screen-menu" aria-label="Residence destinations">
  <div class="icon-pair">
    <button aria-label="Trophy Room" title="Trophy Room">🏆</button>
    <button aria-label="Prize Machine" title="Prize Machine">🎁</button>
  </div>
  <button class="word-button" onclick="location.href='exhibit.html?area=collection&start=exhibit'">COLLECTION</button>
  <div class="icon-pair">
    <button aria-label="Sticker Machine" title="Sticker Machine">🏷️</button>
    <button aria-label="Computer" title="Computer">💻</button>
  </div>
  <button class="word-button" onclick="location.href='exhibit.html?area=gallery&start=thumbnail&count=66'">GALLERY</button>

</main>
<nav class="game-menu-bar" aria-label="Residence menu"><a href="index.html">MUSEUM</a><button type="button" data-display-mode>FULL</button></nav>
<script src="game-bar.js?v=257"></script>
<script>
/* v257 — Residence Atelier label cap.
   Horizontal 20/40/20/20 geometry remains authoritative. Any height beyond
   the square image stays above it. At 20 CSS px the label appears. The label
   box may grow only to 3x its rendered font size; any further surplus becomes
   blank margin ABOVE the label, keeping the label attached to the image. */
(function(){
  const spots=[...document.querySelectorAll('.atelier-spot')];
  function fitAtelier(){
    for(const spot of spots){
      const label=spot.querySelector('.atelier-label');
      const w=spot.clientWidth;
      const h=spot.clientHeight;
      const top=Math.max(0,h-w);
      const imageH=Math.min(h,w);
      const fontSize=parseFloat(getComputedStyle(label).fontSize)||16;
      const maxLabelH=fontSize*3;
      const labelH=top>=20?Math.min(top,maxLabelH):top;
      const topBlank=Math.max(0,top-labelH);
      spot.style.setProperty('--atelier-label-h',labelH+'px');
      spot.style.setProperty('--atelier-top-blank',topBlank+'px');
      spot.style.setProperty('--atelier-image-h',imageH+'px');
      label.classList.toggle('has-label',top>=20);
    }
  }
  new ResizeObserver(fitAtelier).observe(document.querySelector('.residence'));
  addEventListener('resize',fitAtelier);
  addEventListener('mashpeditionviewportchange',fitAtelier);
  fitAtelier();
})();
</script>
</body>
</html>
