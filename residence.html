<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Residence</title>
<link rel="stylesheet" href="residence.css">
</head>
<body>
<a class="museum-exit" href="index.html" aria-label="Return to Museum">MUSEUM</a>
<main class="residence">

<section class="identity">
  <div class="profile-picture"></div>
  <div class="identity-copy">
    <div class="player-name">PLAYER NAME</div>
    <div class="player-title">CURRENT TITLE</div>
    <div class="player-words">WORDS / STATUS / IDENTITY TEXT</div>
  </div>
</section>

<nav class="quick-actions" aria-label="Quick actions">
  <button aria-label="Mailbox" title="Mailbox">📬</button>
  <button aria-label="Guestbook" title="Guestbook">📖</button>
  <button aria-label="Trick-or-Treat Box" title="Trick-or-Treat Box">🎃</button>
</nav>

<section class="microflex-board">
  <div class="board-title">MICROFLEX BOARD</div>
  <div class="board-space"></div>
  <div class="event-strip"><div></div><div></div><div></div></div>
</section>

<section class="atelier" aria-label="Atelier">
  <button class="art-slot" aria-label="Artwork 1"></button>
  <button class="art-slot" aria-label="Artwork 2"></button>
  <button class="art-slot" aria-label="Artwork 3"></button>
  <button class="art-slot" aria-label="Artwork 4"></button>
  <button class="art-slot" aria-label="Artwork 5"></button>
  <button class="art-slot" aria-label="Artwork 6"></button>
  <button class="art-slot" aria-label="Artwork 7"></button>
  <button class="art-slot" aria-label="Artwork 8"></button>
</section>

<nav class="second-screen-menu" aria-label="Residence destinations">
  <div class="icon-pair">
    <button aria-label="Trophy Room" title="Trophy Room">🏆</button>
    <button aria-label="Prize Machine" title="Prize Machine">🎁</button>
  </div>
  <button class="word-button">COLLECTION</button>
  <div class="icon-pair">
    <button aria-label="Sticker Machine" title="Sticker Machine">🏷️</button>
    <button aria-label="Computer" title="Computer">💻</button>
  </div>
  <button class="word-button">GALLERY</button>
</nav>

</main>
</body>
</html>
