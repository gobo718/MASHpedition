<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Common Grounds Café</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2;color:#111}
body{overflow:hidden}
main{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;position:relative}
.cg-canvas{position:relative;width:980px;height:300px;background:#e8e3da;border:3px solid #26221d;overflow:hidden;flex:none}
.zone{position:absolute;border:3px solid #26221d;background:#f7f3eb;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;letter-spacing:.05em;z-index:3}
.donors{left:16px;top:16px;width:132px;height:220px;flex-direction:column;padding:8px}
.cafe{left:210px;top:16px;width:300px;height:74px;flex-direction:column}
.bookshop{right:16px;top:48px;width:92px;height:234px;flex-direction:column;padding:6px}
.bookshop .vertical-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:17px;letter-spacing:.08em}
.hendec-svg{position:absolute;inset:0;width:980px;height:300px;z-index:2;overflow:visible;pointer-events:none}
.hendec-fill{fill:#eee9df;stroke:none}
.hendec-side{stroke:#26221d;stroke-width:4;stroke-linecap:square}
.installation-button{position:absolute;left:666px;top:150px;transform:translate(-50%,-50%);width:154px;height:58px;border:3px solid #26221d;background:#fff;color:#111;font-size:18px;font-weight:900;letter-spacing:.06em;z-index:4;cursor:pointer}

.map-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.map-overlay.open{display:flex}
.map-card{position:relative;width:min(94vw,980px);height:min(88vh,720px);background:#e8e3da;border:3px solid #26221d}
.map-close{position:absolute;right:10px;top:8px;z-index:3;border:2px solid #26221d;background:#fff;font-size:24px;font-weight:900;width:42px;height:42px;cursor:pointer}
.map-title{position:absolute;left:18px;top:12px;font-size:18px;font-weight:900;letter-spacing:.06em;white-space:nowrap;z-index:3}
.large-map-svg{position:absolute;left:0;top:0;width:100%;height:100%}
.large-side{stroke:#26221d;stroke-width:5;stroke-linecap:square}
.large-art{fill:#fff;stroke:#26221d;stroke-width:2}
.large-num{font-size:13px;font-weight:900;text-anchor:middle;dominant-baseline:middle}


.installation-view{position:fixed;inset:0;background:#f4f0e8;z-index:30;display:none;align-items:center;justify-content:center}
.installation-view.open{display:flex}
.installation-stage{position:relative;width:980px;height:337px;background:#f4f0e8;overflow:hidden;flex:none}
.installation-scene{position:absolute;left:0;top:0;width:980px;height:300px;overflow:hidden;background:#f4f0e8}
.installation-position{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.08em;z-index:9}
/* v72: ratio-solved Installation geometry; corrected mirrored B placement and black entrance blanks.
   v71 basis:
   Base unit U=65px, front art S=230px. The visible layout is solved as relationships,
   not independent coordinates: outer=58.501, front gap=2U=130, front->corner=U,
   corner=8, corner->angled=U. Angled projection is .8413S=193.499px.
   58.501 + 230 + 130 + 230 + 65 + 8 + 65 + 193.499 = 980 exactly.
   The opposite template is the exact horizontal mirror. The angled near edge is
   1.5406S=354.338px and is intentionally clipped vertically by the 300px viewport. */
.installation-front-art{position:absolute;box-sizing:border-box;width:230px;height:230px;top:35px;margin:0;padding:0;border:5px solid #26221d;background:#fff;color:#201d19;font-weight:900;font-size:18px;letter-spacing:.05em;display:none;align-items:center;justify-content:center;overflow:hidden;z-index:4}
.installation-front-left{left:58.501px}.installation-front-right{left:418.501px}
.installation-corner-line{position:absolute;top:0;width:8px;height:300px;background:#26221d;z-index:6;display:none}
.installation-corner-left{left:258.499px}.installation-corner-right{left:713.501px}
.installation-side-art{position:absolute;top:-27.169px;width:193.499px;height:354.338px;border:0;margin:0;padding:0;background:transparent;color:#201d19;font-weight:900;font-size:18px;letter-spacing:.05em;display:none;z-index:4}
.installation-side-left{left:0}.installation-side-right{left:786.501px}
.installation-side-art svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.installation-side-art .side-fill{fill:#fff;stroke:#26221d;stroke-width:5;vector-effect:non-scaling-stroke;stroke-linejoin:miter}
.installation-side-art span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.installation-side-left svg{transform:scaleX(-1)}
/* A: straight pair | corner | angled next. */
.installation-scene[data-template="A"] .installation-front-art,
.installation-scene[data-template="A"] .installation-corner-right,
.installation-scene[data-template="A"] .installation-side-right{display:flex}
/* B: angled previous | corner | straight pair. Exact mirror of A. */
.installation-scene[data-template="B"] .installation-front-art,
.installation-scene[data-template="B"] .installation-corner-left,
.installation-scene[data-template="B"] .installation-side-left{display:flex}
.installation-scene[data-template="B"] .installation-front-left{left:331.499px}
.installation-scene[data-template="B"] .installation-front-right{left:691.499px}
.installation-empty{position:absolute;top:0;height:300px;background:#000;display:none;z-index:2}
.installation-empty-left{left:0;width:258.499px}
.installation-empty-right{left:721.501px;width:258.499px}
.installation-empty-slot{left:418.501px;top:0;width:295px;height:300px}
/* Entrance/open-side states reuse the solved templates and simply omit the missing wall. */
.installation-scene[data-template="ENTRY_START"] .installation-front-art,
.installation-scene[data-template="ENTRY_START"] .installation-corner-left,
.installation-scene[data-template="ENTRY_START"] .installation-empty-left{display:flex}
.installation-scene[data-template="ENTRY_START"] .installation-front-left{left:331.499px}
.installation-scene[data-template="ENTRY_START"] .installation-front-right{left:691.499px}
.installation-scene[data-template="ENTRY_END"] .installation-front-art,
.installation-scene[data-template="ENTRY_END"] .installation-corner-right,
.installation-scene[data-template="ENTRY_END"] .installation-empty-right{display:flex}
/* 20 | open entrance wall | angled 1: the entrance is one continuous architectural side, not a black artwork slot. The black field fills from the second wall position through the corner boundary. */
.installation-scene[data-template="ENTRY_WRAP"] .installation-front-left,
.installation-scene[data-template="ENTRY_WRAP"] .installation-corner-right,
.installation-scene[data-template="ENTRY_WRAP"] .installation-side-right,
.installation-scene[data-template="ENTRY_WRAP"] .installation-empty-slot{display:flex}
.installation-scene[data-template="ENTRY_WRAP"] .installation-front-left{left:58.501px}
.installation-controls{position:absolute;left:0;right:0;bottom:0;height:37px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:2px solid #26221d}
.installation-controls button{border:0;border-right:2px solid #26221d;background:#fff;font-weight:900;font-size:12px;letter-spacing:.05em}.installation-controls button:last-child{border-right:0}
@media(max-width:1000px){.installation-stage{transform:scale(calc((100vw - 12px)/980));transform-origin:center center}}

.front-door{position:absolute;left:330px;bottom:0;width:60px;height:31px;border:3px solid #26221d;border-bottom:0;background:#111;z-index:4}
.front-door-label{position:absolute;left:360px;bottom:34px;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.06em;z-index:4;white-space:nowrap}
.museum{position:fixed;left:12px;bottom:12px;border:1px solid #555;background:#fff;color:#111;text-decoration:none;font-weight:700;padding:10px 14px}
@media(max-width:1000px){.cg-canvas{transform:scale(calc((100vw - 12px)/980));transform-origin:center center}}
</style>
</head>
<body>
<main>
  <section class="cg-canvas" aria-label="Common Grounds aerial room prototype">
    <div class="zone donors">DONOR'S CLUB
    </div>
    <div class="zone cafe">CAFÉ</div>
    <div class="zone bookshop"><span class="vertical-title">BOOKSHOP</span></div>

    <svg class="hendec-svg" viewBox="0 0 980 300" aria-hidden="true">
      <g id="hendecagonGeometry"></g>
    </svg>
    <button id="hendecMapButton" class="installation-button" aria-label="Open Installation map">INSTALLATION</button>

    <div class="front-door" aria-label="Front door"></div>
    <div class="front-door-label">FRONT DOOR</div>
  </section>
  <a class="museum" href="index.html">MUSEUM</a>
</main>
<div id="installationMap" class="map-overlay" aria-hidden="true">
  <div class="map-card" role="dialog" aria-modal="true" aria-label="Installation map">
    <button id="mapClose" class="map-close" aria-label="Close map">×</button>
    <div class="map-title">INSTALLATION</div>
    <svg class="large-map-svg" viewBox="0 0 980 620" aria-label="20 artwork Installation map"><g id="largeHendecagon"></g></svg>
  </div>
</div>
<div id="installationView" class="installation-view" aria-hidden="true">
  <section class="installation-stage" aria-label="Installation player view">
    <div id="installationScene" class="installation-scene" data-template="ENTRY_START">
      <div class="installation-position" id="installationPosition">1–2</div>
      <div class="installation-empty installation-empty-left" aria-hidden="true"></div>
      <button class="installation-side-art installation-side-left" id="installationSideLeft" type="button"><svg viewBox="0 0 193.499 354.338" aria-hidden="true"><polygon class="side-fill" points="0,62.169 193.499,0 193.499,354.338 0,292.169"/></svg><span>2</span></button>
      <div class="installation-corner-line installation-corner-left" aria-hidden="true"></div>
      <button class="installation-front-art installation-front-left" id="installationFrontLeft" type="button"><span>1</span></button>
      <button class="installation-front-art installation-front-right" id="installationFrontRight" type="button"><span>2</span></button>
      <div class="installation-empty installation-empty-slot" aria-hidden="true"></div>
      <div class="installation-corner-line installation-corner-right" aria-hidden="true"></div>
      <div class="installation-empty installation-empty-right" aria-hidden="true"></div>
      <button class="installation-side-art installation-side-right" id="installationSideRight" type="button"><svg viewBox="0 0 193.499 354.338" aria-hidden="true"><polygon class="side-fill" points="0,62.169 193.499,0 193.499,354.338 0,292.169"/></svg><span>3</span></button>
    </div>
    <nav class="installation-controls" aria-label="Installation navigation">
      <button id="installationLeft" type="button">LEFT</button>
      <button id="installationRight" type="button">RIGHT</button>
      <button id="installationMapBack" type="button">MAP</button>
      <button id="installationExit" type="button">COMMON GROUNDS</button>
    </nav>
  </section>
</div>

<script>
(()=>{
  const svgNS='http://www.w3.org/2000/svg';
  const n=11, entranceSide=7, start=-Math.PI/2;
  const points=(cx,cy,r)=>Array.from({length:n},(_,i)=>{const a=start+i*2*Math.PI/n;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}});
  function drawRoom(){
    const g=document.getElementById('hendecagonGeometry'), pts=points(666,150,112);
    const poly=document.createElementNS(svgNS,'polygon');
    poly.setAttribute('points',pts.map(p=>`${p.x},${p.y}`).join(' ')); poly.setAttribute('class','hendec-fill'); g.appendChild(poly);
    for(let i=0;i<n;i++){ if(i===entranceSide) continue; const a=pts[i],b=pts[(i+1)%n]; const line=document.createElementNS(svgNS,'line');
      line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','hendec-side');g.appendChild(line); }
  }
  function drawLarge(){
    const g=document.getElementById('largeHendecagon'), pts=points(490,310,292); let artNo=1;
    // Number from the entrance and continue clockwise: 1 -> 20.
    const clockwiseSides=Array.from({length:n-1},(_,step)=>(entranceSide+1+step)%n);
    for(const i of clockwiseSides){ const a=pts[i],b=pts[(i+1)%n]; const line=document.createElementNS(svgNS,'line');
      line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','large-side');g.appendChild(line);
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,angle=Math.atan2(dy,dx)*180/Math.PI;
      for(const t of [.34,.66]){const mx=a.x+dx*t+nx*24,my=a.y+dy*t+ny*24;const box=document.createElementNS(svgNS,'rect');box.setAttribute('x',-30);box.setAttribute('y',-18);box.setAttribute('width',60);box.setAttribute('height',36);box.setAttribute('class','large-art');box.setAttribute('data-art',artNo);box.style.cursor='pointer';box.setAttribute('transform',`translate(${mx} ${my}) rotate(${angle})`);g.appendChild(box);const text=document.createElementNS(svgNS,'text');text.setAttribute('x',mx);text.setAttribute('y',my);text.setAttribute('class','large-num');text.setAttribute('data-art',artNo);text.style.cursor='pointer';text.textContent=artNo++;g.appendChild(text);}
    }
  }
  drawRoom(); drawLarge();
  const overlay=document.getElementById('installationMap'),button=document.getElementById('hendecMapButton'),close=document.getElementById('mapClose');
  const openMap=()=>{overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');close.focus()};
  const closeMap=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');button.focus()};
  button.addEventListener('click',openMap);close.addEventListener('click',closeMap);overlay.addEventListener('click',e=>{if(e.target===overlay)closeMap()});
  const iv=document.getElementById('installationView'),scene=document.getElementById('installationScene');
  const fl=document.getElementById('installationFrontLeft'),fr=document.getElementById('installationFrontRight'),sl=document.getElementById('installationSideLeft'),sr=document.getElementById('installationSideRight'),pos=document.getElementById('installationPosition');
  /* Exact clockwise walk supplied by Billy. There are only two repeating templates:
     A = straight pair + angled next; B = angled previous + straight pair.
     The three entrance states represent the open eleventh wall. */
  const states=[
    {t:'ENTRY_START',f:[1,2],label:'1–2'},
    {t:'A',f:[1,2],r:3,label:'1–2 · 3 angled'},
    {t:'B',l:2,f:[3,4],label:'2 angled · 3–4'},
    {t:'A',f:[3,4],r:5,label:'3–4 · 5 angled'},
    {t:'B',l:4,f:[5,6],label:'4 angled · 5–6'},
    {t:'A',f:[5,6],r:7,label:'5–6 · 7 angled'},
    {t:'B',l:6,f:[7,8],label:'6 angled · 7–8'},
    {t:'A',f:[7,8],r:9,label:'7–8 · 9 angled'},
    {t:'B',l:8,f:[9,10],label:'8 angled · 9–10'},
    {t:'A',f:[9,10],r:11,label:'9–10 · 11 angled'},
    {t:'B',l:10,f:[11,12],label:'10 angled · 11–12'},
    {t:'A',f:[11,12],r:13,label:'11–12 · 13 angled'},
    {t:'B',l:12,f:[13,14],label:'12 angled · 13–14'},
    {t:'A',f:[13,14],r:15,label:'13–14 · 15 angled'},
    {t:'B',l:14,f:[15,16],label:'14 angled · 15–16'},
    {t:'A',f:[15,16],r:17,label:'15–16 · 17 angled'},
    {t:'B',l:16,f:[17,18],label:'16 angled · 17–18'},
    {t:'A',f:[17,18],r:19,label:'17–18 · 19 angled'},
    {t:'B',l:18,f:[19,20],label:'18 angled · 19–20'},
    {t:'ENTRY_END',f:[19,20],label:'19–20'},
    {t:'ENTRY_WRAP',f:[20,null],r:1,label:'20 · entrance · 1 angled'}
  ];
  let stateIndex=0;
  const setLabel=(el,value)=>{const span=el.querySelector('span');if(span)span.textContent=value??'';};
  function renderInstallation(){
    const st=states[stateIndex];
    scene.dataset.template=st.t;
    setLabel(fl,st.f?.[0]); setLabel(fr,st.f?.[1]); setLabel(sl,st.l); setLabel(sr,st.r);
    pos.textContent=st.label;
  }
  function stateForArt(art){
    // Map click enters the first state in which that artwork is straight/front-facing.
    const i=states.findIndex(st=>st.f&&st.f.includes(art)); return i<0?0:i;
  }
  function openInstallation(art=1){stateIndex=stateForArt(art);renderInstallation();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');iv.classList.add('open');iv.setAttribute('aria-hidden','false');}
  function closeInstallation(){iv.classList.remove('open');iv.setAttribute('aria-hidden','true');}
  document.getElementById('largeHendecagon').addEventListener('click',e=>{const art=Number(e.target.dataset.art);if(art)openInstallation(art)});
  const stepInstallation=delta=>{stateIndex=(stateIndex+delta+states.length)%states.length;renderInstallation()};
  document.getElementById('installationLeft').addEventListener('click',()=>stepInstallation(-1));
  document.getElementById('installationRight').addEventListener('click',()=>stepInstallation(1));

  /* Swipe navigation uses the same one-state movement as LEFT/RIGHT.
     Horizontal intent must dominate vertical motion so normal page gestures are not hijacked. */
  let swipeStartX=null,swipeStartY=null,swipeTracking=false;
  const SWIPE_MIN=42, SWIPE_RATIO=1.25;
  iv.addEventListener('touchstart',e=>{
    if(!iv.classList.contains('open')||e.touches.length!==1)return;
    const t=e.touches[0]; swipeStartX=t.clientX; swipeStartY=t.clientY; swipeTracking=true;
  },{passive:true});
  iv.addEventListener('touchend',e=>{
    if(!swipeTracking||swipeStartX===null||swipeStartY===null){swipeTracking=false;return;}
    const t=e.changedTouches[0],dx=t.clientX-swipeStartX,dy=t.clientY-swipeStartY;
    swipeTracking=false; swipeStartX=swipeStartY=null;
    if(Math.abs(dx)>=SWIPE_MIN && Math.abs(dx)>Math.abs(dy)*SWIPE_RATIO){
      // Finger left reveals the next/rightward state; finger right reveals the previous/leftward state.
      stepInstallation(dx<0?1:-1);
    }
  },{passive:true});
  iv.addEventListener('touchcancel',()=>{swipeTracking=false;swipeStartX=swipeStartY=null},{passive:true});

  document.getElementById('installationMapBack').addEventListener('click',()=>{closeInstallation();openMap()});
  document.getElementById('installationExit').addEventListener('click',closeInstallation);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(iv.classList.contains('open'))closeInstallation();else if(overlay.classList.contains('open'))closeMap()}if(iv.classList.contains('open')&&e.key==='ArrowLeft')document.getElementById('installationLeft').click();if(iv.classList.contains('open')&&e.key==='ArrowRight')document.getElementById('installationRight').click();});
})();
</script>
</body>
</html>
