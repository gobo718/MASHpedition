<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Common Grounds Café</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2;color:#111}
body{overflow:hidden}
main{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;position:relative}
.cg-canvas{position:relative;width:980px;height:300px;background:#e8e3da;border:3px solid #26221d;overflow:hidden;flex:none}
.zone{position:absolute;border:3px solid #26221d;background:#f7f3eb;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;letter-spacing:.05em;z-index:3}
.donors{left:16px;top:16px;width:132px;height:220px;flex-direction:column;padding:8px}
.cafe{left:210px;top:16px;width:300px;height:74px;flex-direction:column}
.bookshop{right:16px;top:48px;width:92px;height:234px;flex-direction:column;padding:6px}
.bookshop .vertical-title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:17px;letter-spacing:.08em}
.hendec-svg{position:absolute;inset:0;width:980px;height:300px;z-index:2;overflow:visible;pointer-events:none}
.hendec-fill{fill:#eee9df;stroke:none}
.hendec-side{stroke:#26221d;stroke-width:4;stroke-linecap:square}
.installation-button{position:absolute;left:666px;top:150px;transform:translate(-50%,-50%);width:154px;height:58px;border:3px solid #26221d;background:#fff;color:#111;font-size:18px;font-weight:900;letter-spacing:.06em;z-index:4;cursor:pointer}

.map-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.map-overlay.open{display:flex}
.map-card{position:relative;width:min(94vw,980px);height:min(88vh,720px);background:#e8e3da;border:3px solid #26221d}
.map-close{position:absolute;right:10px;top:8px;z-index:3;border:2px solid #26221d;background:#fff;font-size:24px;font-weight:900;width:42px;height:42px;cursor:pointer}
.map-title{position:absolute;left:18px;top:12px;font-size:18px;font-weight:900;letter-spacing:.06em;white-space:nowrap;z-index:3}
.large-map-svg{position:absolute;left:0;top:0;width:100%;height:100%}
.large-side{stroke:#26221d;stroke-width:5;stroke-linecap:square}
.large-art{fill:#fff;stroke:#26221d;stroke-width:2}
.large-num{font-size:13px;font-weight:900;text-anchor:middle;dominant-baseline:middle}


.installation-view{position:fixed;inset:0;background:#f4f0e8;z-index:30;display:none;align-items:center;justify-content:center}
.installation-view.open{display:flex}
.installation-stage{position:relative;width:980px;height:337px;background:#f4f0e8;overflow:hidden;flex:none}
.installation-scene{position:absolute;left:0;top:0;width:980px;height:300px;overflow:hidden;background:#f4f0e8}
.installation-position{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:12px;font-weight:900;letter-spacing:.08em;z-index:6}
.installation-front-art{position:absolute;box-sizing:border-box;width:230px;height:230px;top:35px;margin:0;padding:0;border:5px solid #26221d;background:#fff;color:#201d19;font-weight:900;font-size:18px;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* Reuse the approved Exhibit corner positions instead of inventing new blank spacing. */
.installation-front-left{left:375px}.installation-front-right{left:736.8181818px}
.installation-corner-line{position:absolute;left:235.1818182px;top:0;width:8px;height:300px;background:#26221d;z-index:5}
/* Hendecagon side-art recipe: 0.8413 x 230 = 193.499px apparent span.
   Far edge = 230px; near edge = 1.5406 x 230 = 354.338px.
   Draw the frame as its own polygon so ALL FOUR black edges survive perspective. */
.installation-side-art{position:absolute;left:41.6828182px;top:-27.169px;width:193.499px;height:354.338px;border:0;margin:0;padding:0;background:#26221d;color:#201d19;font-weight:900;font-size:18px;letter-spacing:.05em;clip-path:polygon(0 0,100% 17.55%,100% 82.45%,0 100%);overflow:hidden;z-index:4}
.installation-side-art::before{content:"";position:absolute;inset:5px;background:#fff;clip-path:polygon(0 0,100% 17.55%,100% 82.45%,0 100%);z-index:-1}
.installation-side-art span{position:relative;z-index:2;display:flex;width:100%;height:100%;align-items:center;justify-content:center}
/* Clockwise is the canonical construction. Counterclockwise is its exact mirror. */
.installation-scene[data-side="right"]{transform:scaleX(-1)}
.installation-scene[data-side="right"] .installation-front-art span,
.installation-scene[data-side="right"] .installation-side-art span,
.installation-scene[data-side="right"] .installation-position{transform:scaleX(-1)}
.installation-scene[data-side="right"] .installation-position{left:auto;right:50%}
.installation-controls{position:absolute;left:0;right:0;bottom:0;height:37px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-top:2px solid #26221d}
.installation-controls button{border:0;border-right:2px solid #26221d;background:#fff;font-weight:900;font-size:12px;letter-spacing:.05em}.installation-controls button:last-child{border-right:0}
@media(max-width:1000px){.installation-stage{transform:scale(calc((100vw - 12px)/980));transform-origin:center center}}

.front-door{position:absolute;left:330px;bottom:0;width:60px;height:31px;border:3px solid #26221d;border-bottom:0;background:#111;z-index:4}
.front-door-label{position:absolute;left:360px;bottom:34px;transform:translateX(-50%);font-size:8px;font-weight:900;letter-spacing:.06em;z-index:4;white-space:nowrap}
.museum{position:fixed;left:12px;bottom:12px;border:1px solid #555;background:#fff;color:#111;text-decoration:none;font-weight:700;padding:10px 14px}
@media(max-width:1000px){.cg-canvas{transform:scale(calc((100vw - 12px)/980));transform-origin:center center}}
</style>
</head>
<body>
<main>
  <section class="cg-canvas" aria-label="Common Grounds aerial room prototype">
    <div class="zone donors">DONOR'S CLUB
    </div>
    <div class="zone cafe">CAFÉ</div>
    <div class="zone bookshop"><span class="vertical-title">BOOKSHOP</span></div>

    <svg class="hendec-svg" viewBox="0 0 980 300" aria-hidden="true">
      <g id="hendecagonGeometry"></g>
    </svg>
    <button id="hendecMapButton" class="installation-button" aria-label="Open Installation map">INSTALLATION</button>

    <div class="front-door" aria-label="Front door"></div>
    <div class="front-door-label">FRONT DOOR</div>
  </section>
  <a class="museum" href="index.html">MUSEUM</a>
</main>
<div id="installationMap" class="map-overlay" aria-hidden="true">
  <div class="map-card" role="dialog" aria-modal="true" aria-label="Installation map">
    <button id="mapClose" class="map-close" aria-label="Close map">×</button>
    <div class="map-title">INSTALLATION</div>
    <svg class="large-map-svg" viewBox="0 0 980 620" aria-label="20 artwork Installation map"><g id="largeHendecagon"></g></svg>
  </div>
</div>
<div id="installationView" class="installation-view" aria-hidden="true">
  <section class="installation-stage" aria-label="Installation player view">
    <div id="installationScene" class="installation-scene" data-side="right">
      <div class="installation-position" id="installationPosition">1–2</div>
      <button class="installation-front-art installation-front-left" id="installationFrontLeft" type="button"><span>1</span></button>
      <button class="installation-front-art installation-front-right" id="installationFrontRight" type="button"><span>2</span></button>
      <div class="installation-corner-line" aria-hidden="true"></div>
      <button class="installation-side-art" id="installationSideArt" type="button"><span>3</span></button>
    </div>
    <nav class="installation-controls" aria-label="Installation navigation">
      <button id="installationLeft" type="button">LEFT</button>
      <button id="installationRight" type="button">RIGHT</button>
      <button id="installationMapBack" type="button">MAP</button>
      <button id="installationExit" type="button">COMMON GROUNDS</button>
    </nav>
  </section>
</div>

<script>
(()=>{
  const svgNS='http://www.w3.org/2000/svg';
  const n=11, entranceSide=7, start=-Math.PI/2;
  const points=(cx,cy,r)=>Array.from({length:n},(_,i)=>{const a=start+i*2*Math.PI/n;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}});
  function drawRoom(){
    const g=document.getElementById('hendecagonGeometry'), pts=points(666,150,112);
    const poly=document.createElementNS(svgNS,'polygon');
    poly.setAttribute('points',pts.map(p=>`${p.x},${p.y}`).join(' ')); poly.setAttribute('class','hendec-fill'); g.appendChild(poly);
    for(let i=0;i<n;i++){ if(i===entranceSide) continue; const a=pts[i],b=pts[(i+1)%n]; const line=document.createElementNS(svgNS,'line');
      line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','hendec-side');g.appendChild(line); }
  }
  function drawLarge(){
    const g=document.getElementById('largeHendecagon'), pts=points(490,310,292); let artNo=1;
    // Number from the entrance and continue clockwise: 1 -> 20.
    const clockwiseSides=Array.from({length:n-1},(_,step)=>(entranceSide+1+step)%n);
    for(const i of clockwiseSides){ const a=pts[i],b=pts[(i+1)%n]; const line=document.createElementNS(svgNS,'line');
      line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','large-side');g.appendChild(line);
      const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,angle=Math.atan2(dy,dx)*180/Math.PI;
      for(const t of [.34,.66]){const mx=a.x+dx*t+nx*24,my=a.y+dy*t+ny*24;const box=document.createElementNS(svgNS,'rect');box.setAttribute('x',-30);box.setAttribute('y',-18);box.setAttribute('width',60);box.setAttribute('height',36);box.setAttribute('class','large-art');box.setAttribute('data-art',artNo);box.style.cursor='pointer';box.setAttribute('transform',`translate(${mx} ${my}) rotate(${angle})`);g.appendChild(box);const text=document.createElementNS(svgNS,'text');text.setAttribute('x',mx);text.setAttribute('y',my);text.setAttribute('class','large-num');text.setAttribute('data-art',artNo);text.style.cursor='pointer';text.textContent=artNo++;g.appendChild(text);}
    }
  }
  drawRoom(); drawLarge();
  const overlay=document.getElementById('installationMap'),button=document.getElementById('hendecMapButton'),close=document.getElementById('mapClose');
  const openMap=()=>{overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');close.focus()};
  const closeMap=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');button.focus()};
  button.addEventListener('click',openMap);close.addEventListener('click',closeMap);overlay.addEventListener('click',e=>{if(e.target===overlay)closeMap()});
  const iv=document.getElementById('installationView'),scene=document.getElementById('installationScene');
  const fl=document.getElementById('installationFrontLeft'),fr=document.getElementById('installationFrontRight'),sa=document.getElementById('installationSideArt'),pos=document.getElementById('installationPosition');
  let cursor=1,lastDir=1;
  const wrapArt=v=>((v-1+20)%20)+1;
  const setLabel=(el,value)=>{const span=el.querySelector('span'); if(span) span.textContent=value; else el.textContent=value;};
  function renderInstallation(){
    const a=wrapArt(cursor),b=wrapArt(cursor+1);
    scene.dataset.side=lastDir>0?'right':'left';
    setLabel(fl,a); setLabel(fr,b);
    setLabel(sa,lastDir>0?wrapArt(cursor+2):wrapArt(cursor-1));
    pos.textContent=`${a}–${b}`;
  }
  function openInstallation(art=1){cursor=wrapArt(art);lastDir=1;renderInstallation();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');iv.classList.add('open');iv.setAttribute('aria-hidden','false');}
  function closeInstallation(){iv.classList.remove('open');iv.setAttribute('aria-hidden','true');}
  document.getElementById('largeHendecagon').addEventListener('click',e=>{const art=Number(e.target.dataset.art);if(art)openInstallation(art)});
  document.getElementById('installationLeft').addEventListener('click',()=>{lastDir=-1;cursor=wrapArt(cursor-1);renderInstallation()});
  document.getElementById('installationRight').addEventListener('click',()=>{lastDir=1;cursor=wrapArt(cursor+1);renderInstallation()});
  document.getElementById('installationMapBack').addEventListener('click',()=>{closeInstallation();openMap()});
  document.getElementById('installationExit').addEventListener('click',closeInstallation);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(iv.classList.contains('open'))closeInstallation();else if(overlay.classList.contains('open'))closeMap()}if(iv.classList.contains('open')&&e.key==='ArrowLeft')document.getElementById('installationLeft').click();if(iv.classList.contains('open')&&e.key==='ArrowRight')document.getElementById('installationRight').click();});
})();
</script>
</body>
</html>
