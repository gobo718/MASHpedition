<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Laboratory</title>
<link rel="stylesheet" href="lab.css">
</head>
<body>
<a class="museum-exit" href="index.html" aria-label="Return to Museum">MUSEUM</a>
<main class="laboratory">

  <section class="lab-left" aria-label="Laboratory inputs and equipment">
    <div class="lab-heading">LABORATORY</div>

    <section class="input-zone" aria-label="Mutosis inputs">
      <div class="emoji-pair" aria-label="Emoji inputs">
        <button class="emoji-input" type="button" aria-label="Select Emoji A">
          <span class="emoji-slot">A</span>
          <span class="input-label">EMOJI A</span>
        </button>
        <div class="plus" aria-hidden="true">+</div>
        <button class="emoji-input" type="button" aria-label="Select Emoji B">
          <span class="emoji-slot">B</span>
          <span class="input-label">EMOJI B</span>
        </button>
      </div>

      <div class="input-tools" aria-label="Laboratory tools">
        <button type="button">FIELDS</button>
        <button type="button">KEYWORDS</button>
        <button type="button" class="mosaics-button">MOSAICS</button>
      </div>
    </section>

    <section class="agglomerator" aria-label="Chimeric Agglomerator">
      <div class="equipment-heading">CHIMERIC AGGLOMERATOR</div>
      <div class="agglomerator-body" aria-hidden="true">
        <div class="agglomerator-vessel">
          <div class="gem-placeholder">GEM</div>
        </div>
        <div class="agglomerator-pipe pipe-left"></div>
        <div class="agglomerator-pipe pipe-right"></div>
      </div>
    </section>
  </section>

  <section class="mutosis-machine" aria-label="Mutosis machine">
    <div class="machine-top">MUTOSIS MACHINE</div>
    <div class="machine-body">
      <div class="machine-port left-port" aria-hidden="true"></div>
      <div class="result-window" aria-label="Mashup result">
        <div class="result-placeholder">MASHUP</div>
      </div>
      <div class="machine-port right-port" aria-hidden="true"></div>
    </div>
    <button class="activate" type="button">ACTIVATE MUTOSIS</button>

    <div class="result-actions" aria-label="Mashup actions">
      <button type="button">SAVE</button>
      <button type="button">DISCARD / RETRY</button>
      <button type="button">SUBMIT</button>
      <button type="button">REVIEW DRAFTS</button>
    </div>
  </section>

</main>
</body>
</html>
