<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Parade</title>
<link rel="stylesheet" href="endless-wall.css?v=229">
</head>
<body>
<main class="endless-shell" id="endlessShell" data-view="wall" aria-label="Parade view">
  <section class="endless-stage" id="endlessStage" aria-live="polite">
    <div class="endless-wall" id="endlessWall">
      <button class="endless-art" id="wallA" type="button"></button>
      <button class="endless-art" id="wallB" type="button"></button>
      <button class="endless-art" id="wallC" type="button"></button>
    </div>

    <section class="endless-thumbnails" id="thumbnailView" aria-label="Thumbnail view">
      <div class="thumbnail-grid" id="thumbnailGrid"></div>
    </section>

    <div class="view-label" id="viewLabel">PARADE</div>
  </section>

  <nav class="endless-controls" aria-label="Parade navigation">
    <button type="button" id="leftBtn">LEFT</button>
    <button type="button" id="rightBtn">RIGHT</button>
    <button type="button" id="thumbnailBtn">THUMBNAILS</button>
    <button type="button" id="paradeBtn" hidden>PARADE</button>
    <a href="index.html">MUSEUM</a>
    <button type="button" data-display-mode>FULL</button>
  </nav>
</main>
<script src="endless-wall.js?v=229"></script>
<script src="game-bar.js?v=229"></script>
</body>
</html>
