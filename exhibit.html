<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Exhibit View</title>
<link rel="stylesheet" href="exhibit.css">
</head>
<body>
<main class="exhibit-shell" id="exhibitShell" data-view="room" aria-label="Exhibit view">
  <section class="room-stage" id="roomStage" aria-live="polite">
    <div class="room-frame" id="roomFrame">
      <button class="slot angled-left" id="angledLeft" type="button" hidden></button>
      <div class="corner left-corner" id="leftCorner" hidden aria-hidden="true"></div>
      <button class="slot flat-left" id="flatLeft" type="button" hidden></button>
      <button class="slot flat-center" id="flatCenter" type="button" hidden></button>
      <button class="slot flat-right" id="flatRight" type="button" hidden></button>
      <div class="corner right-corner" id="rightCorner" hidden aria-hidden="true"></div>
      <button class="slot angled-right" id="angledRight" type="button" hidden></button>
    </div>

    <section class="wall-view" id="wallView" aria-label="Wall view">
      <div class="flat-wall">
        <button class="wall-art" id="wallArt" type="button" aria-label="Zoom artwork">
          <span id="wallArtLabel">ART 1</span>
        </button>
      </div>
    </section>

    <section class="artwork-view" id="artworkView" aria-label="Artwork detail">
      <div class="artwork-large"><span id="artworkLabel">ART 1</span></div>
      <nav class="artwork-depth" aria-label="Artwork information">
        <button type="button" data-depth="image">IMAGE</button>
        <button type="button" data-depth="plaque">PLAQUE</button>
        <button type="button" data-depth="blurblets">BLURBLETS</button>
      </nav>
      <div class="depth-panel" id="depthPanel">IMAGE DETAIL</div>
    </section>

    <section class="thumbnail-view" id="thumbnailView" aria-label="Thumbnail view">
      <div class="thumbnail-grid" id="thumbnailGrid"></div>
    </section>

    <div class="view-label" id="viewLabel">LEFT CORNER VIEW</div>
  </section>

  <nav class="exhibit-controls" aria-label="Exhibit navigation">
    <button type="button" id="leftBtn">LEFT</button>
    <button type="button" id="rightBtn">RIGHT</button>
    <button type="button" id="thumbnailBtn">THUMBNAIL</button>
    <button type="button" id="doorBtn">DOOR</button>
  </nav>

  <a class="museum-return" href="index.html">MUSEUM</a>
</main>
<script src="exhibit.js"></script>
</body>
</html>
