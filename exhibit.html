<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Artwork Viewer</title>
<link rel="stylesheet" href="exhibit.css">
</head>
<body>
<main class="viewer-shell" id="viewerShell" data-view="thumbnail" aria-label="Artwork viewer">
  <section class="viewer-stage" id="viewerStage" aria-live="polite">

    <section class="exhibit-map-view" id="exhibitMapView" aria-label="Exhibit view">
      <nav class="rank-selector" id="exhibitRanks" aria-label="Grand Exhibition Hall rank layer">
        <button type="button" data-rank="1">1ST</button>
        <button type="button" data-rank="2">2ND</button>
        <button type="button" data-rank="3">3RD</button>
      </nav>
      <div class="exhibit-map" id="exhibitMap">
        <div class="map-wall map-top" id="mapTop"></div>
        <div class="map-wall map-left" id="mapLeft"></div>
        <div class="map-center" id="mapCenter">EXHIBIT</div>
        <div class="map-wall map-right" id="mapRight"></div>
        <div class="map-wall map-bottom" id="mapBottom"></div>
      </div>
    </section>

    <section class="room-view" id="roomView" aria-label="Room view">
      <div class="room-frame" id="roomFrame">
        <button class="slot angled-left" id="angledLeft" type="button" hidden></button>
        <div class="corner left-corner" id="leftCorner" hidden aria-hidden="true"></div>
        <button class="slot flat-left" id="flatLeft" type="button" hidden></button>
        <button class="slot flat-center" id="flatCenter" type="button" hidden></button>
        <button class="slot flat-right" id="flatRight" type="button" hidden></button>
        <div class="corner right-corner" id="rightCorner" hidden aria-hidden="true"></div>
        <button class="slot angled-right" id="angledRight" type="button" hidden></button>
      </div>
    </section>

    <section class="thumbnail-view" id="thumbnailView" aria-label="Thumbnail view">
      <nav class="rank-selector" id="thumbnailRanks" aria-label="Grand Exhibition Hall rank layer">
        <button type="button" data-rank="1">1ST</button>
        <button type="button" data-rank="2">2ND</button>
        <button type="button" data-rank="3">3RD</button>
      </nav>
      <div class="thumbnail-status" id="thumbnailStatus"></div>
      <div class="thumbnail-grid" id="thumbnailGrid"></div>
    </section>

    <section class="endless-view" id="endlessView" aria-label="Endless wall view">
      <div class="endless-wall" id="endlessWall">
        <button class="endless-art" id="endlessA" type="button"></button>
        <button class="endless-art" id="endlessB" type="button"></button>
        <button class="endless-art" id="endlessC" type="button"></button>
      </div>
      <div class="endless-status" id="endlessStatus"></div>
    </section>

    <section class="artwork-view" id="artworkView" aria-label="Artwork detail">
      <button class="artwork-back" id="artworkBack" type="button">BACK</button>
      <div class="artwork-large" id="artworkLarge"><span id="artworkLabel">ART 1</span></div>
      <div class="artwork-copy" id="artworkCopy"></div>
    </section>

    <div class="view-label" id="viewLabel"></div>
  </section>

  <nav class="viewer-controls" id="viewerControls" aria-label="Viewing navigation">
    <button type="button" id="leftBtn">LEFT</button>
    <button type="button" id="rightBtn">RIGHT</button>
    <button type="button" id="exhibitBtn" data-capability="exhibit">EXHIBIT</button>
    <button type="button" id="roomBtn" data-capability="room">ROOM</button>
    <button type="button" id="thumbnailBtn" data-capability="thumbnail">THUMBNAILS</button>
    <button type="button" id="endlessBtn" data-capability="endless">ENDLESS</button>
    <button type="button" id="doorBtn" data-capability="room">DOOR</button>
    <a href="index.html">MUSEUM</a>
  </nav>
</main>
<script src="exhibit.js"></script>
</body>
</html>
