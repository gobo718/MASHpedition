<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASHpedition Exhibit Entrance Template</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f2f2f2;color:#111}
.entrance{width:100vw;height:100dvh;position:relative;display:grid;place-items:center}
.entrance__identity{text-align:center}
.entrance__identity h1{margin:0 0 10px;font-size:clamp(28px,5vw,64px)}
.entrance__identity p{margin:0;font-weight:700}
.entrance__museum{position:fixed;left:12px;bottom:12px;border:1px solid #555;background:#fff;color:#111;text-decoration:none;font-weight:700;padding:10px 14px}
</style>
</head>
<body>
<main class="entrance" data-template="exhibit-entrance">
  <section class="entrance__identity">
    <h1>EXHIBIT ENTRANCE</h1>
    <p>ENTRANCE TEMPLATE</p>
  </section>
  <a class="entrance__museum" href="index.html">MUSEUM</a>
</main>
</body>
</html>
